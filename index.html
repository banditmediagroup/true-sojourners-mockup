<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 48px 40px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      text-align: center;
    }

    .lock {
      font-size: 32px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
      letter-spacing: 0.1em;
    }

    input[type="password"]::placeholder {
      color: #555;
      letter-spacing: normal;
    }

    input[type="password"]:focus {
      border-color: #555;
    }

    input[type="password"].error {
      border-color: #c0392b;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #e8e8e8;
    }

    .error-msg {
      font-size: 13px;
      color: #c0392b;
      margin-top: 10px;
      min-height: 18px;
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock">&#128274;</div>
    <h1>Protected Preview</h1>
    <p>This site mockup is password protected.<br>Enter your access code to continue.</p>
    <input type="password" id="pwd" placeholder="Access code" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button onclick="check()">View Mockup</button>
    <div class="error-msg" id="err"></div>
    <div class="footer">Shared via Bandit Media Group</div>
  </div>

  <script>
    var input = document.getElementById('pwd');
    var err = document.getElementById('err');

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') check();
    });

    input.addEventListener('input', function() {
      input.classList.remove('error');
      err.textContent = '';
    });

    function check() {
      var val = input.value.trim().toLowerCase().replace(/\s+/g, '');
      if (val === 'sojourners26') {
        window.location.href = 'preview.html';
      } else {
        input.classList.add('error');
        err.textContent = 'Incorrect access code. Please try again.';
        input.value = '';
        input.focus();
      }
    }
  </script>
</body>
</html>
