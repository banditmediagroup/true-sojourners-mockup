<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Sojourners — Site Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
      background: #F5EFE4;
      color: #1A2321;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #FBF8F2;
      border: 1px solid rgba(26,35,33,.12);
      border-radius: 16px;
      padding: 48px 40px 40px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(11,43,43,.08);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-wrap img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: brightness(0) saturate(100%) invert(9%) sepia(30%) saturate(600%) hue-rotate(135deg) brightness(90%);
    }

    .brand-name {
      font-family: 'Marcellus', 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      color: #0B2B2B;
      letter-spacing: -0.01em;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(26,35,33,.18);
      margin: 0 auto 28px;
    }

    h1 {
      font-family: 'Marcellus', Georgia, serif;
      font-size: 22px;
      font-weight: 400;
      color: #0B2B2B;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    p {
      font-size: 14px;
      color: #5E6A66;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #5E6A66;
      text-align: left;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid rgba(26,35,33,.2);
      border-radius: 8px;
      color: #1A2321;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 12px;
      letter-spacing: 0.1em;
    }

    input[type="password"]::placeholder {
      color: #9BA39F;
      letter-spacing: normal;
    }

    input[type="password"]:focus {
      border-color: #1A6450;
      box-shadow: 0 0 0 3px rgba(26,100,80,.12);
    }

    input[type="password"].error {
      border-color: #A8432F;
      box-shadow: 0 0 0 3px rgba(168,67,47,.1);
    }

    button {
      width: 100%;
      padding: 13px;
      background: #1A6450;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #14503F;
    }

    .error-msg {
      font-size: 13px;
      color: #A8432F;
      margin-top: 10px;
      min-height: 18px;
      text-align: left;
    }

    .footer {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid rgba(26,35,33,.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bmg-logo {
      height: 18px;
      width: auto;
      opacity: 0.35;
    }
  </style>
</head>
